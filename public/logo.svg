<svg
  width="128"
  height="128"
  viewBox="0 0 128 128"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>
  <!-- Background -->
  <circle cx="64" cy="64" r="64" fill="#000" />

  <!-- Centered content group -->
  <g transform="translate(64 70)">
    
    <!-- Invoice paper -->
    <path
      d="M-22 -34
         C-22 -38 -19 -40 -16 -40
         H16
         C19 -40 22 -38 22 -34
         V28
         L14 22
         L6 28
         L-2 22
         L-10 28
         L-18 22
         Z"
      fill="#fff"
    />

    <!-- Invoice lines -->
    <rect x="-12" y="-26" width="24" height="6" rx="3" fill="#000" />
    <rect x="-12" y="-14" width="20" height="6" rx="3" fill="#000" />
    <rect x="-12" y="-2"  width="16" height="6" rx="3" fill="#000" />

    <!-- Check badge (included in centering math) -->
    <circle cx="18" cy="18" r="12" fill="#000" />
    <path
      d="M13 18
         L17 22
         L23 14"
      fill="none"
      stroke="#fff"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
