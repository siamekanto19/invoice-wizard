<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <!-- blue → indigo → purple gradient (to bottom-right) -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>   <!-- blue-500 -->
      <stop offset="50%" stop-color="#4F46E5"/>  <!-- indigo-600 -->
      <stop offset="100%" stop-color="#9333EA"/> <!-- purple-600 -->
    </linearGradient>
    <!-- soft blue shadow similar to shadow-blue-500/25 -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#3B82F6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- rounded tile -->
  <rect x="0" y="0" width="80" height="80" rx="24" fill="url(#bgGradient)" filter="url(#dropShadow)"/>

  <!-- Lucide file-text icon, scaled to 40×40 and centered -->
  <g transform="translate(20,20) scale(1.6667)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
    <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
    <path d="M10 9H8"/>
    <path d="M16 13H8"/>
    <path d="M16 17H8"/>
  </g>
</svg>
